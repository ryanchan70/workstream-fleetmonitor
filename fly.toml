# Fly.io deployment.
#   fly launch --no-deploy      (creates the app; keep this file)
#   fly volumes create fleet_data --size 1
#   fly secrets set FLEET_EMAIL=you@example.com FLEET_PASSWORD=...
#   fly deploy
app = "fleet-monitor"
primary_region = "iad"          # put this near your rigs / the fleet API

[build]
  dockerfile = "Dockerfile"

[env]
  FLEET_HOSTED = "1"
  FLEET_STATE_DIR = "/data"
  PORT = "8080"

# Persistent state. Without this, every deploy wipes the session caches and
# the dashboard has to re-backfill from scratch.
[mounts]
  source = "fleet_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true

  # CRITICAL: this process must never sleep. It polls every 5 seconds and
  # detects recording start/stop transitions by comparing against the
  # previous poll. If the machine is suspended, those transitions are missed
  # and sessions silently go unlogged.
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"

# One instance only. Two would double-count: each would run its own polling
# loop and its own in-memory totals against the same fleet.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"