<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Changelog — Fleet Monitor</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Geist+Mono:wght@400;600&display=swap">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --text-color: #e5e7eb;
            --text-muted: #9ca3af;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --border: #1f2937;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 22px 20px 60px;
            background: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 0.9rem;
            line-height: 1.6;
        }
        .wrap { max-width: 780px; margin: 0 auto; }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
            font-size: 0.78rem;
            text-decoration: none;
            padding: 5px 10px 5px 7px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--card-bg);
        }
        .back-link:hover { color: var(--text-color); border-color: #374151; }
        /* Darker than the page so it reads as an inset note rather than a
           card competing with the changelog entries below it. */
        .feedback-note {
            margin: 14px 0 22px 0;
            padding: 12px 14px;
            background: #080c14;
            border: 1px solid #1b2434;
            border-radius: 8px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .fb-title { margin: 0 0 9px 0; }
        .feedback-note textarea {
            width: 100%;
            box-sizing: border-box;
            resize: vertical;
            min-height: 58px;
            font-family: inherit;
            font-size: 0.8rem;
            line-height: 1.5;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #1f2937;
            background: var(--bg-color);
            color: var(--text-color);
        }
        .feedback-note textarea::placeholder { color: #4b5563; }
        .feedback-note textarea:focus {
            outline: none;
            border-color: var(--accent-blue);
        }
        .fb-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 9px;
        }
        .feedback-note button {
            font-family: inherit;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 6px;
            border: 1px solid #283245;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
        }
        .feedback-note button:hover:not(:disabled) {
            border-color: var(--accent-blue);
            color: #93c5fd;
        }
        .feedback-note button:disabled { opacity: 0.45; cursor: default; }
        .fb-status { font-size: 0.75rem; }
        .fb-status.ok { color: var(--accent-green); }
        .fb-status.err { color: #f87171; }
        .sr-only {
            position: absolute; width: 1px; height: 1px;
            padding: 0; margin: -1px; overflow: hidden;
            clip: rect(0 0 0 0); white-space: nowrap; border: 0;
        }
        .back-link:focus-visible { outline: 2px solid var(--accent-blue); outline-offset: 2px; }

        .doc { margin-top: 26px; }
        /* A real type scale. The previous sizes (1.3 / 1.0 / 0.86rem against
           0.9rem body text) were close enough that every level read as the
           same size, so the document had no visible hierarchy. */
        .doc h1 {
            font-size: 2rem;
            line-height: 1.2;
            margin: 0 0 6px;
            text-transform: capitalize;
            letter-spacing: -0.02em;
        }
        .doc h2 {
            font-size: 1.4rem;
            line-height: 1.25;
            margin: 38px 0 12px;
            padding-bottom: 7px;
            border-bottom: 1px solid var(--border);
            color: var(--accent-blue);
            font-family: 'Geist Mono', monospace;
            letter-spacing: -0.01em;
        }
        .doc h3 {
            font-size: 1.08rem;
            line-height: 1.3;
            margin: 22px 0 9px;
            color: var(--accent-green);
        }
        .doc h4 { font-size: 0.95rem; margin: 18px 0 7px; color: var(--text-color); }
        .doc h5 { font-size: 0.88rem; margin: 16px 0 6px; color: var(--text-muted); }
        .doc h6 {
            font-size: 0.78rem;
            font-weight: 400;
            font-style: italic;
            margin: 26px 0 0;
            color: var(--text-muted);
        }
        .doc p { margin: 9px 0; }
        .doc ul { margin: 9px 0; padding-left: 22px; }
        .doc li { margin: 5px 0; }
        .doc li > ul { margin: 4px 0 6px; }
        .doc strong { color: #fff; font-weight: 600; }
        .doc code {
            font-family: 'Geist Mono', monospace;
            font-size: 0.82em;
            background: #0d1424;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 1px 5px;
        }
        .doc a { color: var(--accent-blue); }
        .doc hr { border: none; border-top: 1px solid var(--border); margin: 26px 0; }
        .status { color: var(--text-muted); font-size: 0.82rem; margin-top: 22px; }

        /* Long issue text, URLs and deep bullet nesting all overflow a phone
           viewport otherwise. Nested lists also indent cumulatively, so the
           padding is reduced rather than kept at the desktop value. */
        .doc, .doc li, .doc p { overflow-wrap: anywhere; }
        .doc pre { overflow-x: auto; }

        @media (max-width: 600px) {
            body { padding: 14px 13px 44px; font-size: 0.86rem; }
            .doc h1 { font-size: 1.55rem; }
            .doc h2 { font-size: 1.15rem; margin-top: 28px; }
            .doc h3 { font-size: 0.98rem; }
            .doc h4 { font-size: 0.9rem; }
            .doc ul { padding-left: 18px; }
            .doc li > ul { padding-left: 15px; }
        }
    </style>
</head>
<body>
<div class="wrap">
    <a class="back-link" href="/" aria-label="Back to the fleet monitor">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M19 12H5"></path><path d="m12 19-7-7 7-7"></path>
        </svg>
        Back to monitor
    </a>

    <div class="feedback-note">
        <p class="fb-title">Want a feature? Got a bug? We're working on it&trade;</p>
        <label for="fb-text" class="sr-only">Your feedback</label>
        <textarea id="fb-text" rows="3" maxlength="2000"
                  placeholder="What would make this more useful?"></textarea>
        <div class="fb-row">
            <button type="button" id="fb-send" onclick="sendFeedback()">Submit</button>
            <span id="fb-status" class="fb-status"></span>
        </div>
    </div>

    <div id="doc" class="doc"><p class="status">Loading changelog…</p></div>
</div>

<script>
    const TOKEN_KEY = "fleet_dashboard_token";

    function esc(s) {
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // Inline renderer for the subset of Markdown changelog.md actually uses:
    // ATX headings, nested bullet lists, bold/italic, inline code, links and
    // rules. Deliberately not a CDN dependency for a page this small.
    function renderInline(text) {
        let s = esc(text);
        s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
        s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
        s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,
                      '<a href="$2" rel="noopener noreferrer">$1</a>');
        return s;
    }

    function renderMarkdown(md) {
        const out = [];
        const indents = [];    // indent width of each open <ul>
        const liOpen  = [];    // whether that <ul> currently has an open <li>

        // A nested list has to be emitted INSIDE the parent <li>, not beside
        // it, so the parent's <li> is left open until a sibling or the close
        // of its list arrives.
        const closeLi = () => {
            if (liOpen.length && liOpen[liOpen.length - 1]) {
                out.push('</li>');
                liOpen[liOpen.length - 1] = false;
            }
        };
        const closeList = () => {
            closeLi();
            out.push('</ul>');
            indents.pop();
            liOpen.pop();
        };
        const closeDeeperThan = (indent) => {
            while (indents.length && indents[indents.length - 1] > indent) closeList();
        };
        const closeAll = () => { while (indents.length) closeList(); };

        for (const raw of md.replace(/\r\n/g, '\n').split('\n')) {
            const line = raw.trimEnd();
            if (!line.trim()) continue;

            const bullet = line.match(/^(\s*)[-*+]\s+(.*)$/);
            if (bullet) {
                const indent = bullet[1].replace(/\t/g, '    ').length;
                closeDeeperThan(indent);
                if (!indents.length || indents[indents.length - 1] < indent) {
                    out.push('<ul>');           // opens inside the parent <li>
                    indents.push(indent);
                    liOpen.push(false);
                } else {
                    closeLi();                  // sibling at the same level
                }
                out.push('<li>' + renderInline(bullet[2]));
                liOpen[liOpen.length - 1] = true;
                continue;
            }

            closeAll();

            const heading = line.match(/^(#{1,6})\s+(.*)$/);
            if (heading) {
                const level = Math.min(heading[1].length, 6);
                out.push('<h' + level + '>' + renderInline(heading[2]) + '</h' + level + '>');
            } else if (/^([-*_])\1{2,}$/.test(line.trim())) {
                out.push('<hr>');
            } else {
                out.push('<p>' + renderInline(line.trim()) + '</p>');
            }
        }
        closeAll();
        return out.join('\n');
    }

    async function sendFeedback() {
        const box = document.getElementById('fb-text');
        const btn = document.getElementById('fb-send');
        const out = document.getElementById('fb-status');
        const text = box.value.trim();

        const say = (msg, cls) => { out.textContent = msg; out.className = 'fb-status ' + (cls || ''); };

        if (!text) return say('Write something first.', 'err');

        const token = localStorage.getItem(TOKEN_KEY);
        if (!token) return say('Sign in on the monitor first.', 'err');

        btn.disabled = true;
        say('Sending…');
        try {
            const res = await fetch('/api/feedback', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify({ text: text }),
            });
            const data = await res.json().catch(() => ({}));
            if (res.status === 401) return say('Session expired — sign in again.', 'err');
            if (!res.ok || !data.ok) return say(data.error || 'Could not send that.', 'err');
            // Clearing only on success means a failed send never loses what
            // the user typed.
            box.value = '';
            say('Thanks — got it.', 'ok');
        } catch (e) {
            say('Could not reach the server.', 'err');
        } finally {
            btn.disabled = false;
        }
    }

    (async function load() {
        const doc = document.getElementById('doc');
        const token = localStorage.getItem(TOKEN_KEY);
        if (!token) {
            doc.innerHTML = '<p class="status">Not signed in. ' +
                '<a href="/">Sign in on the monitor</a> to read the changelog.</p>';
            return;
        }
        try {
            const res = await fetch('/api/changelog', {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            if (res.status === 401) {
                doc.innerHTML = '<p class="status">Session expired. ' +
                    '<a href="/">Sign in again</a>.</p>';
                return;
            }
            if (!res.ok) throw new Error('changelog ' + res.status);
            const data = await res.json();
            doc.innerHTML = renderMarkdown(data.markdown || '');
        } catch (e) {
            doc.innerHTML = '<p class="status">Could not load the changelog: ' +
                            esc(e.message || e) + '</p>';
        }
    })();
</script>
</body>
</html>
